name: CI/CD Pipeline - Test & Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  # ─── 1. TEST & VALIDATE (CI) ───────────────────────────────────────────────
  test-and-build:
    name: Run Automated Tests & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run RAG Benchmark (if secrets configured)
        if: env.DATABASE_URL != '' && env.GEMINI_API_KEY != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test:rag

      - name: Verify Next.js Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_APP_URL: https://prept.duckdns.org
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ─── 2. CONTINUOUS DEPLOYMENT TO EC2 (CD) ──────────────────────────────────
  deploy-to-ec2:
    name: Deploy to AWS EC2 via SSH
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH into EC2 & Re-deploy Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd prept
            git pull origin main
            docker compose up -d --build
            docker image prune -f
